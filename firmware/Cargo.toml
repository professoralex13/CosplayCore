[package]
name = "firmware"
version = "0.1.0"
authors = ["Alex Cutforth <alex@densem.net>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version= "0.51", features=["alloc", "experimental"] }
anyhow = "1.0.101"
esp-idf-hal = "0.45.2"

[build-dependencies]
embuild = "0.33"
